services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphling
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: graphling
    # No published port — same as Flockt's own `db` service. Once a server mediates
    # every ledger read/write, Postgres never needs to be reachable from outside this
    # box at all; only the `server` container below talks to it, over the compose
    # network at postgres:5432.
    volumes:
      - graphling_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphling"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    image: feenstra32/graphling-server:f703991
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRADE_DB_URL: postgresql://graphling:${POSTGRES_PASSWORD}@postgres:5432/graphling
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      # Beta gating (server/config.py beta_guild_id): unset/empty = anyone can sign in.
      BETA_GUILD_ID: ${BETA_GUILD_ID:-}
      BETA_ROLE_ID: ${BETA_ROLE_ID:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      UEXCORP_API_KEY: ${UEXCORP_API_KEY}
      UEXCORP_BEARER_TOKEN: ${UEXCORP_BEARER_TOKEN}
      # LLM gateway (docs/llm-gateway.md). heket over Tailscale, e.g.
      # http://100.x.y.z:11434; the digest pins the evaluated model build.
      # The FRANKENCOMPUTE_* fallbacks are heket's pre-2026-10-16 nickname, kept so this
      # works before /opt/graphling/.env is renamed. Drop them once it is.
      HEKET_URL: ${HEKET_URL:-${FRANKENCOMPUTE_URL:-}}
      HEKET_MODEL_DIGEST: ${HEKET_MODEL_DIGEST:-${FRANKENCOMPUTE_MODEL_DIGEST:-}}
      # Fallback when heket can't answer (server/config.py fallback_provider,
      # default anthropic). Only the chosen provider's key is needed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # TTS gateway: Kokoro on heket over Tailscale, e.g. http://100.x.y.z:8880.
      # ElevenLabs is the optional fallback (a different voice); leave its key empty to
      # have ALICE stay quiet instead while heket is down.
      HEKET_TTS_URL: ${HEKET_TTS_URL:-${FRANKENCOMPUTE_TTS_URL:-}}
      # ALICE's prompts (server/prompt_service.py). With a LangSmith key the server pulls
      # them from the Hub (EU tenant) and re-pulls every PROMPT_REFRESH_S; without one it
      # serves the snapshot baked into the image. PROMPT_HUB_TAG (e.g. "prod") = only the
      # tagged commit goes live -- moving the tag in the Hub is the release.
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://eu.api.smith.langchain.com}
      PROMPT_HUB_TAG: ${PROMPT_HUB_TAG:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_USD_PER_1K_CHARS: ${ELEVENLABS_USD_PER_1K_CHARS:-0}
    # Bound to loopback only, not 0.0.0.0 — nginx (already on this box, see
    # docs/deploy.md) is the only path in, proxying api.heyalice.help to here, same
    # shape as Flockt's app.flockt.farm -> 127.0.0.1:8088.
    ports:
      - "127.0.0.1:8090:8000"

volumes:
  graphling_pgdata:
