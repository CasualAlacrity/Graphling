<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- ALICE app icon: the hero image's push-to-talk waveform (docs/assets/alice-hero.svg)
       on the brand's near-black, with the same orange bar gradient. -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9142"/>
      <stop offset="1" stop-color="#F2650C"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0D0F10"/>
  <rect x="4" y="4" width="248" height="248" rx="44" fill="none" stroke="#33373A" stroke-width="4"/>
  <g fill="url(#bar)">
    <rect x="38"  y="110" width="18" height="36"  rx="9"/>
    <rect x="70"  y="88"  width="18" height="80"  rx="9"/>
    <rect x="102" y="54"  width="18" height="148" rx="9"/>
    <rect x="134" y="80"  width="18" height="96"  rx="9"/>
    <rect x="166" y="64"  width="18" height="128" rx="9"/>
    <rect x="198" y="100" width="18" height="56"  rx="9"/>
  </g>
</svg>
