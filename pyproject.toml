[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alice"
version = "0.1.0"
description = "ALICE — a voice copilot and trade route tracker for Star Citizen, built on LangChain/LangGraph."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
# One supported entry point: voice + overlay co-resident in one process.
alice = "overlay.overlay_app:main"
# Voice only, no overlay — quick debugging, not a supported run mode.
alice-voice = "voice:main"

# Packages/modules live directly under app/ (e.g. "overlay.filter_panel", "db.session")
# with no "app." prefix — every import in the codebase is already written that way, so
# app/ is the package root rather than a package itself.
[tool.setuptools]
package-dir = { "" = "app" }
py-modules = ["graph", "llm", "prompt_loader"]

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
